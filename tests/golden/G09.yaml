notes: |
  Rounding per D-46 (Kite's contract note, captured 2026-11-06, K-10): every component is exact; stamp
  duty alone is rounded half-up to the whole rupee; GST is 18 % of the exact brokerage + exchange + SEBI;
  the order total is the exact sum rounded half-up to the paisa (charges.csv shows each component rounded
  for reading). Turnover per order = 65 x 2,500,000 = 162,500,000 paise.
  Brokerage min(20.00, 0.03 %) = 2000. Exchange 0.00183 % = 2973.75. SEBI 0.0001 % = 162.5.
  Stamp (buy) 0.002 % = 32.50 rupees -> 33.00 = 3300. GST 18 % of (2000 + 2973.75 + 162.5) = 924.525.
  STT (sell) 0.02 % = 32,500 on 2026-03-31, 0.05 % = 81,250 from 2026-04-01 (Z-2).
  Buy: 2000 + 2973.75 + 162.5 + 3300 + 924.525 = 9360.775 -> 9361.
  Sell 2026-03-31: 2000 + 32500 + 2973.75 + 162.5 + 924.525 = 38560.775 -> 38561 (day 47,922).
  Sell 2026-04-01: 2000 + 81250 + 2973.75 + 162.5 + 924.525 = 87310.775 -> 87311 (day 96,672). Kite's own
  note for this sell on 2026-11-06 is Rs 873.10775. (A3 first listed 47,874 / 96,624, rounding each
  component to the paisa and stamp to the paisa; the capture showed that is not what Kite does.)
  Cash: 100,000,000 - 47,922 = 99,952,078; then - 96,672 = 99,855,406 (the position is flat each day).
