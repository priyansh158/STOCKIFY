notes: |
  Bought at 09:16: 1 lot (100) of the future at 1,000.00, 100 calls strike 950.00 at 60.00 (-600,000) and 100
  puts strike 1,050.00 at 70.00 (-700,000). FSP 1,020.00. All three expire in the money, so all are delivered
  (A4 §7.3): the future takes 100 shares at the FSP 1,020.00 (its variation pays +200,000 first), the call
  takes 100 at its strike 950.00, the put gives 100 at its strike 1,050.00. The options close at 0, so their
  premiums are their P&L.
  Netting: take 200, give 100, so N = 100 units are netted. In instrument order the future (id 2) claims the 100
  take units first and the put (id 4) the 100 give units; the call (id 3) is delivered.
  Charges (STT 0.1% of each leg's value both sides; brokerage 0.25% delivered / 0.1% netted; GST 18% on
  brokerage; exercise STT 0.125% of a long ITM option's intrinsic value):
    future 10,200,000: brokerage 0.1% 10,200; STT 10,200; GST 1,836: 22,236.
    call    9,500,000: brokerage 0.25% 23,750; STT 9,500 + 0.125% of intrinsic 700,000 = 875 -> 10,375; GST 4,275:
            38,400.
    put    10,500,000: brokerage 0.1% 10,500; STT 10,500 + 0.125% of 300,000 = 375 -> 10,875; GST 1,890: 23,265.
    Total 83,901.
  Cash 50,000,000 - 600,000 - 700,000 + 200,000 - 10,200,000 - 9,500,000 + 10,500,000 - 83,901 = 39,616,099.
  Holding: buy 100 at 1,020.00, buy 100 at 950.00 (cost 19,700,000 for 200), sell 100 at 1,050.00 (removes
  half the cost, 9,850,000; realised 10,500,000 - 9,850,000 = 650,000): 100 shares at 985.00 average; marked at
  the stock's last price 1,020.00, unrealised 350,000. NAV 39,616,099 + 100 x 102,000 = 49,816,099.
  Check: call +100,000 (70 intrinsic - 60 premium), put -400,000 (30 - 70), future +200,000: -100,000, less
  83,901 charges = -183,901 = NAV - capital. Without the SETTLE record the fallback settles at DAY_END at the
  stock's last price (the 15:29 bar's close, 1,020.00): the same numbers, labelled.
